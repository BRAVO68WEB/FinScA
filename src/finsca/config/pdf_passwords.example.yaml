# Copy to data/pdf_passwords.yaml (gitignored) or:
#   finsca passwords add 01011990 --match hdfc
#   finsca passwords add ABCPD1234E --match icici
#
# Indian CC statements often use DOB (ddmmyyyy) or PAN.
# "match" is a filename substring; omit it to try the password on every PDF.

passwords:
  - password: "ddmmyyyy"
    match: hdfc
  - password: "ddmmyyyy"
    match: icici
  # - password: "also-tried-on-every-locked-pdf"
