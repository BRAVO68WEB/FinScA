[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finsca"
version = "0.1.0"
description = "Personal Financial Services Agent — local agentic CLI for Indian bank statements"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FinScA" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
finsca = "finsca.cli.app:app"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/PLAN.md", "/.env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
